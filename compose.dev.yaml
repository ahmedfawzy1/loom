# Local infrastructure for Loom: its own Postgres and MinIO, separate from any other project.
# Ports are offset from the defaults (5432 / 9000) so this can run alongside other stacks.
#   Postgres  localhost:5435   db "loom", user postgres / password
#   MinIO S3  localhost:9010   console http://localhost:9011 (minioadmin / minioadmin)
name: loom

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: loom
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loom"]
      interval: 2s
      timeout: 5s
      retries: 30

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: creates the bucket and applies the public-read policy (media/* only) and the
  # lifecycle rule that expires abandoned uploads under pending/ after a day. Safe to re-run.
  minio-init:
    image: quay.io/minio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./minio:/config:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/loom-media &&
        mc anonymous set-json /config/bucket-policy.json local/loom-media &&
        mc ilm import local/loom-media < /config/lifecycle.json

volumes:
  postgres-data:
  minio-data:
